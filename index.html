<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ist Pflicht, damit env(safe-area-inset-*) auf dem
         iPhone 12 überhaupt Werte liefert.

         KEIN maximum-scale. Es stand hier gegen den iOS-Auto-Zoom beim
         Fokussieren von Eingabefeldern — sperrt aber zugleich das
         Vergrößern mit zwei Fingern, und damit den einzigen Weg, den
         jemand mit schwachen Augen hat. Gegen den Auto-Zoom hilft
         `font-size: max(16px, 1em)` auf Eingabefeldern; die Regel steht
         in index.css und reicht allein. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Zwei Themefarben: iOS färbt die Statusleiste danach. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf4ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1512" />
    <meta name="description" content="Persönliches Dial-in-Werkzeug für Espresso, V60, AeroPress und French Press" />

    <!-- iOS-Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Café" />
    <!-- Die beiden Schnitte, die das dritte Thema („Organic") sofort
         braucht. Vorgeladen statt nachgefordert: Ohne sie zeichnet der
         Browser erst in der Systemschrift und tauscht dann aus — bei
         einer Anzeigeschrift wie Caprasimo springt dabei die ganze
         Überschrift. `crossorigin` ist Pflicht, auch bei eigenem
         Ursprung, sonst lädt der Browser die Datei zweimal. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/figtree-var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/caprasimo-400.woff2" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Café</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
