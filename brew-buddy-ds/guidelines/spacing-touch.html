<!-- @dsCard group="Abstände" viewport="700x160" name="Trefferflächen" subtitle="44 px überall — bedienbar mit nassen Händen" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="padding:16px; background:#fff; font-family:var(--font-sans); color:var(--color-ink); ">
<div style="display:flex; gap:24px; align-items:center">
<div style="position:relative; width:44px; height:44px; border:1px dashed var(--color-crema); border-radius:999px; display:grid; place-items:center"><span style="width:20px; height:20px; border-radius:999px; border:1px solid var(--color-line); font-size:11px; font-weight:600; color:var(--color-mute); display:grid; place-items:center">?</span></div>
<div style="height:44px; padding:0 14px; border-radius:999px; background:var(--color-raised); border:1px solid var(--color-line); display:flex; align-items:center; font-size:15px; color:var(--color-mute)">Washed</div>
<div style="height:56px; width:56px; border-radius:12px; background:var(--color-raised); border:1px solid var(--color-line); display:grid; place-items:center; font-size:20px; color:var(--color-crema-ink)">+</div>
<p style="font-size:13px; color:var(--color-mute); max-width:280px">Der Info-Punkt ist 20 px, seine Trefferfläche 44 px über negativen Rand. Stepper-Knöpfe 56 px.</p></div>
</body>
</html>
