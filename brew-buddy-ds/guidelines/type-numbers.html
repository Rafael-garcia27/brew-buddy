<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="padding:16px; background:#fff; font-family:var(--font-sans); color:var(--color-ink); ">
<div style="display:flex; gap:28px; align-items:flex-end">
<div><div style="font-size:11px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--color-mute)">In</div><div class="tnum" style="font-size:28px; font-weight:600; line-height:1">18,0<span style="font-size:12px; font-weight:400; color:var(--color-mute)">g</span></div></div>
<div><div style="font-size:11px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--color-mute)">Time</div><div class="tnum" style="font-size:20px; font-weight:600; line-height:1">27–30<span style="font-size:12px; font-weight:400; color:var(--color-mute)">s</span></div></div>
<div><div style="font-size:11px; color:var(--color-mute)">Zeit, Handfilter</div><div class="tnum" style="font-size:22px; font-weight:600">2:48</div></div>
<div style="font-size:13px; color:var(--color-mute); max-width:260px">„1:2,0" statt „1:2.0". Zeiten am Handfilter als m:ss, beim Espresso nackte Sekunden. <code>.tnum</code>, damit Timer nicht springen.</div></div>
</body>
</html>
