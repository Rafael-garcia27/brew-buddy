<!-- @dsCard group="Tiefe & Form" viewport="700x200" name="Tiefenwirkung" subtitle="Kanten statt Schatten; Organic mit weichem Schatten" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
</head>
<body style="padding:16px; background:#fff; font-family:var(--font-sans); color:var(--color-ink); ">
<div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px">
<div class="theme-milchkaffee" style="background:var(--color-paper); border-radius:14px; padding:16px"><div style="height:70px; background:var(--color-card); border:1px solid var(--color-line); border-radius:var(--radius-card)"></div><p style="font-size:11px; color:var(--color-mute); margin-top:8px">Hell/Dunkel: 1-px-Sandkante, kein Schatten</p></div>
<div class="theme-organic" style="background:var(--color-paper); border-radius:14px; padding:16px"><div style="height:44px; background:var(--color-crema); border-radius:999px; box-shadow:var(--shadow-soft)"></div><p style="font-size:11px; color:var(--color-mute); margin-top:8px"><code>--shadow-soft</code> 0 3 10 / 16 % — nur Primärknopf</p></div>
<div class="theme-organic" style="background:var(--color-paper); border-radius:14px; padding:16px"><div style="height:70px; background:var(--color-card); border-radius:var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow:var(--shadow-float)"></div><p style="font-size:11px; color:var(--color-mute); margin-top:8px"><code>--shadow-float</code> 0 12 32 / 22 % — Blätter</p></div></div>
</body>
</html>
