<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../components/_preview/bb-loader.js"></script>
</head>
<body style="padding:12px; background:#fff">
<div id="root"></div>
<script type="text/babel">
BB_READY.then((BB) => {

  const { Themes, Header, Section, Card, LogButton, GearButton } = BB
  function Demo() {
    return <Themes pad={0} render={() => (
      <div style={{ margin: '-24px 0 0', paddingTop: 24 }}>
        <Header title="Regal" large right={<><LogButton /><GearButton /></>} />
        <Header title="Hausmischung" subtitle="V60 · im Fenster" onBack={() => {}} />
        <Section title="Brews" action={<span style={{ fontSize: 11, color: 'var(--color-faint)' }}>nach Datum</span>}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingBottom: 14 }}>
            <Card><div style={{ fontWeight: 600 }}>Standard</div><div style={{ fontSize: 13, color: 'var(--color-mute)' }}>Karte mit Sandkante</div></Card>
            <Card tone="accent"><div style={{ fontSize: 12, fontWeight: 500, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--color-crema-ink)' }}>Dein Startpunkt</div></Card>
            <Card tone="warn"><div style={{ fontSize: 14 }}>Warnung</div></Card>
            <Card onClick={() => {}} selected><div style={{ fontSize: 14 }}>gewählt ✓</div></Card>
          </div>
        </Section>
      </div>
    )} />
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
})
</script>
</body>
</html>
