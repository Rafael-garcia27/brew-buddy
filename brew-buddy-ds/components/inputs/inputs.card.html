<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../components/_preview/bb-loader.js"></script>
</head>
<body style="padding:12px; background:#fff">
<div id="root"></div>
<script type="text/babel">
BB_READY.then((BB) => {

  const { Themes, Field, TextInput, Select, Stepper, Toggle } = BB
  function Demo() {
    const [d, setD] = React.useState(18)
    const [t, setT] = React.useState(168)
    const [on, setOn] = React.useState(true)
    const [n, setN] = React.useState('Hausmischung')
    return <Themes render={() => (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <Field label="Name" hint="steht auf der Tüte"><TextInput value={n} onChange={setN} /></Field>
        <Field label="Aufbereitung"><Select value="washed" options={[{ value: 'washed', label: 'Washed' }, { value: 'natural', label: 'Natural' }]} /></Field>
        <Field label="Dosis" term={{ term: 'Dosis', short: 'Menge gemahlener Kaffee.' }}><Stepper label="Dosis" value={d} step={0.1} decimals={1} unit="g" onChange={setD} /></Field>
        <Stepper label="Zeit" value={t} clock onChange={setT} />
        <Toggle label="Dunkel" checked={on} onChange={setOn} />
      </div>
    )} />
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
})
</script>
</body>
</html>
