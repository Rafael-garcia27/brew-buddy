<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../components/_preview/bb-loader.js"></script>
</head>
<body style="padding:12px; background:#fff">
<div id="root"></div>
<script type="text/babel">
BB_READY.then((BB) => {

  const { Themes, Button, Chip, FilterRow, SegmentedControl, GearButton, LogButton, MethodIcon } = BB
  function Demo() {
    const [m, setM] = React.useState('v60')
    const [f, setF] = React.useState('Washed')
    return <Themes render={() => (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <Button block>V60 brühen</Button>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <Button size="sm" variant="secondary">+ Bohne</Button>
          <Button size="sm" variant="ghost">Später</Button>
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <Button size="sm" variant="danger">Löschen</Button>
          <Button size="sm" disabled>Aus</Button>
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {['Washed', 'Natural'].map((x) => <Chip key={x} label={x} active={f === x} onClick={() => setF(x)} />)}
          <Chip label="bitter" tone="bad" active />
        </div>
        <SegmentedControl value={m} onChange={setM} options={['espresso', 'v60', 'aeropress'].map((k) => ({ value: k, label: { espresso: 'Espresso', v60: 'V60', aeropress: 'AeroPress' }[k], icon: <MethodIcon icon={k} size={22} /> }))} />
        <div style={{ display: 'flex', justifyContent: 'flex-end', paddingRight: 8 }}><LogButton /><GearButton /></div>
      </div>
    )} />
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />)
})
</script>
</body>
</html>
